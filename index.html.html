cv.addEventListener('pointerdown',e=>{pts.set(e.pointerId,e);moved=0;drag={x:e.clientX,y:e.clientY};pd=0});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)){cv.style.cursor=hit(e)>=0?'pointer':'grab';return}pts.set(e.pointerId,e);
 if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)want.d=Math.max(10,Math.min(70,want.d*pd/d));pd=d;moved=99;return}
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};moved+=Math.abs(dx)+Math.abs(dy);if(fp){fy-=dx*.005;fpit=Math.max(-.9,Math.min(.9,fpit-dy*.004))}else{yaw-=dx*.006;want.p=Math.max(.25,Math.min(1.45,want.p+dy*.005))}});
addEventListener('pointerup',e=>{if(pts.has(e.pointerId)&&pts.size===1&&moved<6){const i=hit(e);if(lastS)openStaff(lastS);else if(i>=0&&!fp)focus(i)}pts.delete(e.pointerId);pd=0});
cv.addEventListener('wheel',e=>{e.preventDefault();want.d=Math.max(10,Math.min(70,want.d*(1+e.deltaY*.001)))},{passive:false});
function size(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
(function loop(){requestAnimationFrame(loop);const T=performance.now()*.001;anim.forEach(f=>f(T));
 if(run){const dt=Math.min(.05,T-pt);V.forEach(v=>stepV(v,dt,T))}pt=T;
 const asp=cam.aspect,dd=want.d*(cur<0?1+Math.max(0,1.5-asp)*.9:1);
 tgt.lerp(want.t,.08);dist+=(dd-dist)*.08;pitch+=(want.p-pitch)*.08;
 cam.position.set(tgt.x+Math.sin(yaw)*Math.cos(pitch)*dist,tgt.y+Math.sin(pitch)*dist,tgt.z+Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(tgt);
 if(fp)fpTick(T);updBub();R.render(sc,cam)})();
